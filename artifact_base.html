*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;padding-block:0 60px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:900px;margin:0 auto}
.hdr{padding:18px 0 12px;border-bottom:1px solid var(--bd);margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.04em}
.snap{font-size:11px;color:var(--fg3);padding:4px 9px;background:var(--sf);border:1px solid var(--bd);border-radius:20px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;font-size:12px;font-weight:500;border:none;background:none;color:var(--fg3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'IBM Plex Sans',sans-serif}
.tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.pg{display:none}.pg.active{display:block}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:11px 12px}
.sl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600;margin-bottom:2px}
.sv{font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1;color:var(--fg)}
.sv small{font-size:12px;color:var(--fg3)}
.ss{font-size:10px;color:var(--fg3);margin-top:2px}
.up{color:var(--gr)}.dn{color:var(--re)}.wn{color:var(--am)}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.crow.s1{grid-template-columns:1fr}
@media(max-width:560px){.crow{grid-template-columns:1fr}}
.pnl{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px}
.pt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);font-weight:600;margin-bottom:7px}
.leg{display:flex;gap:8px;font-size:10px;color:var(--fg3);margin-bottom:7px;flex-wrap:wrap}
.ld{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px}
canvas{width:100%!important}
.sh{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--bd)}
.ar{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;overflow:hidden}
.ar.open{border-color:var(--ac)}
.ar-top{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.ar-top:hover{background:var(--sf2)}

.ai.run{background:color-mix(in srgb,var(--ac) 12%,var(--sf))}

.an{font-weight:500;font-size:13px}
.am2{font-size:11px;color:var(--fg3);margin-top:1px}

.at2{font-size:10px;color:var(--fg3)}
.ei{font-size:10px;color:var(--fg3);margin-top:auto}

.dyn{border-radius:5px;padding:5px 7px}
.dyn-l{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:600;margin-bottom:1px}
.dyn-v{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--fg);line-height:1}
.dyn-v small{font-size:9px;color:var(--fg3)}
.dyn-v.wn{color:var(--am)}.dyn-v.ok{color:var(--gr)}

.ar.open .detail{display:block}
.gmap{width:100%;border-radius:6px;overflow:hidden;margin-bottom:10px;background:var(--sf2);border:1px solid var(--bd)}
.det-charts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
@media(max-width:560px){.det-charts{grid-template-columns:1fr}}
.det-chart-pnl{background:var(--sf2);border-radius:6px;padding:8px}
.det-chart-title{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:600;margin-bottom:4px}
.stbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}
.stbl th{text-align:right;font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);padding:3px 5px;border-bottom:1px solid var(--bd);font-weight:600}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{padding:3px 5px;border-bottom:1px solid var(--bd);text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg2)}
.stbl td:nth-child(2){text-align:left;font-family:inherit;font-size:10px;color:var(--fg)}
.set-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd);font-size:9px;font-weight:600;color:var(--fg2);font-family:inherit}

.dg-v{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--fg)}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
function copyEl(el){var txt=el.textContent;try{navigator.clipboard.writeText(txt).then(function(){showToast('Copied!');},function(){fb(txt);});}catch(e){fb(txt);}}
function fb(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showToast('Copied!');}catch(e){showToast('Select text above');}document.body.removeChild(ta);}
function buildTab(id){if(id==='today')buildToday();else if(id==='trends')buildTrends();else if(id==='monthly')buildMonthly();else if(id==='activities')buildActivities();}

function secToHMS(s){s=Math.round(s||0);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?h+'h '+m+'m':m+'m '+(sec<10?'0':'')+sec+'s';}
function secToHMSFull(s){s=Math.round(s||0);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return (h?h+':':'')+(h&&m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function briefRow(lbl,val,note,cls){
  return '<tr><td style="padding:4px 8px 4px 0;font-size:11px;color:var(--fg3);width:52%;white-space:nowrap">'+lbl+'</td>'
    +'<td style="padding:4px 0;font-size:12px;font-family:\'IBM Plex Mono\',monospace;white-space:nowrap'+(cls?';color:var(--'+cls+')':'')+'">'+(val!=null&&val!==''?val:'--')
    +(note?'<span style="font-size:10px;color:var(--fg3);margin-left:6px">'+note+'</span>':'')
    +'</td></tr>';
}
function briefSect(num,title){
  return '<div style="margin-top:12px;margin-bottom:2px;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:700;display:flex;align-items:center;gap:8px">'
    +'<span style="background:var(--ac);color:#fff;border-radius:3px;padding:1px 6px;font-size:9px">'+num+'</span>'+title
    +'<span style="flex:1;height:1px;background:var(--bd)"></span></div>'
    +'<div class="pnl" style="padding:6px 10px"><table style="width:100%;border-collapse:collapse">';
}

function buildToday(){
  var t=DATA.today;
  var slp=t.sleep_duration_hours||0,rsc=t.training_readiness_score||0;
  var rc=rsc>=60?'gr':rsc>=40?'':rsc>=25?'am':'re';
  var slpSec=Math.round(slp*3600);
  var deepSec=Math.round((t.deep_sleep_hours||0)*3600);
  var remSec=Math.round((t.rem_sleep_hours||0)*3600);
  var ltSec=Math.round((t.light_sleep_hours||0)*3600);
  var awkSec=Math.round((t.awake_hours||0)*3600);
  function pctOf(a,b){return b>0?Math.round(a/b*100)+'%':null;}
  var deepPct=t.deep_sleep_percentage?Math.round(t.deep_sleep_percentage)+'%':pctOf(deepSec,slpSec);
  var remPct=t.rem_sleep_percentage?Math.round(t.rem_sleep_percentage)+'%':pctOf(remSec,slpSec);
  var ltPct=t.light_sleep_percentage?Math.round(t.light_sleep_percentage)+'%':pctOf(ltSec,slpSec);
  var awkPct=t.awake_percentage?Math.round(t.awake_percentage)+'%':pctOf(awkSec,slpSec)||'0%';
  var bbDelta=t.body_battery_delta;
  var bbDrained=t.bodyBatteryMostRecentValue&&t.body_battery_high?Math.max(0,t.body_battery_high-t.bodyBatteryMostRecentValue):null;
  var hrvDelta=t.hrv_delta_7day;
  var rhrDelta=t.rhr_delta;
  var acwr=t.acwr;
  var acwrCls=acwr?(acwr>1.5?'re':acwr>1.3?'am':acwr<0.8?'am':'gr'):'';
  var verdictTxt=(DATA.verdict||t.verdict||'').replace(/_/g,' ');
  var flags=t.flags||DATA.flags||[];
  var decoupling=null;
  var todayActs=(DATA.acts||[]).filter(function(a){return a.dt===t.metric_date&&a.paHr!=null;});
  if(todayActs.length) decoupling=todayActs[0].paHr;
  var peakTE=null;
  var todayRunActs=(DATA.acts||[]).filter(function(a){return a.dt===t.metric_date&&a.te!=null;});
  if(todayRunActs.length) peakTE=Math.max.apply(null,todayRunActs.map(function(a){return a.te;}));

  var html='';

  // ── 1. Last Night Sleep ────────────────────────────────────────────────────
  html+=briefSect('1','LAST NIGHT SLEEP');
  html+=briefRow('Total sleep', slpSec?secToHMSFull(slpSec):null, t.sleep_score?t.sleep_score+' pts':'', slp<6?'am':slp>=7?'gr':'');
  if(deepSec) html+=briefRow('Deep', secToHMSFull(deepSec), deepPct, '');
  if(remSec)  html+=briefRow('REM',  secToHMSFull(remSec),  remPct,  '');
  if(ltSec)   html+=briefRow('Light',secToHMSFull(ltSec),   ltPct,   '');
  if(awkSec||awkPct) html+=briefRow('Awake', awkSec?secToHMSFull(awkSec):'0:00', awkPct, '');
  if(t.average_spo2||t.spo2_lowest)
    html+=briefRow('SpO₂ (avg / lowest)',
      (t.average_spo2?t.average_spo2+'%':'--')+' / '+(t.spo2_lowest?t.spo2_lowest+'%':'--'), '',
      t.spo2_lowest&&t.spo2_lowest<90?'re':'');
  if(t.avg_sleep_respiration_value) html+=briefRow('Sleep respiration', t.avg_sleep_respiration_value+' brpm', '', '');
  if(bbDelta!=null) html+=briefRow('Body Battery charged', (bbDelta>0?'+':'')+bbDelta, '', bbDelta>0?'gr':'');
  html+='</table></div>';

  // ── 2. Today's Readiness ──────────────────────────────────────────────────
  html+=briefSect('2',"TODAY'S READINESS");
  html+=briefRow('Training readiness',
    rsc+' ['+((t.training_readiness_level||'').replace(/_/g,' '))+']', '', rc);
  if(t.hrv_last_night_avg){
    var hrvNote='';
    if(t.hrv_7day_avg){
      var sign=hrvDelta>0?'+':'';
      var dir=hrvDelta>0?'ABOVE BASELINE ↑':'BELOW BASELINE ↓';
      hrvNote='7-day avg '+t.hrv_7day_avg+', '+(hrvDelta!=null?sign+Math.round(hrvDelta)+' — '+dir:'');
    }
    html+=briefRow('HRV last night', t.hrv_last_night_avg+' ms', hrvNote, hrvDelta>0?'gr':hrvDelta<-10?'am':'');
  }
  if(t.resting_heart_rate){
    var rhrNote=t.rhr_7day_avg?'7-day avg '+t.rhr_7day_avg+(rhrDelta!=null?', '+(rhrDelta>0?'+':'')+rhrDelta+' bpm':''):'';
    html+=briefRow('Resting HR', t.resting_heart_rate+' bpm', rhrNote, rhrDelta!=null?(rhrDelta<0?'gr':rhrDelta>4?'re':''):'');
  }
  if(t.body_battery_current){
    var bbNote=(bbDelta!=null?'charged '+(bbDelta>0?'+':'')+bbDelta:'')+(bbDrained!=null?' / drained '+bbDrained+' today':'');
    html+=briefRow('Body Battery (current)', t.body_battery_current, bbNote, '');
  }
  if(t.avg_stress_level) html+=briefRow('Avg stress', t.avg_stress_level, t.avg_stress_level>50?'High':t.avg_stress_level>35?'Moderate':'Low', t.avg_stress_level>50?'re':t.avg_stress_level>35?'am':'gr');
  html+='</table></div>';

  // ── 3. Training Load (only if data present) ───────────────────────────────
  if(t.atl||t.ctl){
    html+=briefSect('3','TRAINING LOAD');
    if(t.atl) html+=briefRow('Acute Load (ATL)', Math.round(t.atl), '', '');
    if(t.ctl) html+=briefRow('Chronic Load (CTL)', Math.round(t.ctl), '', '');
    if(acwr!=null) html+=briefRow('ACWR', acwr.toFixed(2)+' ['+(t.acwr_label||'')+']', 'optimal 0.80–1.30', acwrCls);
    if(t.sleep_score) html+=briefRow('Sleep score', t.sleep_score, '', '');
    if(decoupling!=null) html+=briefRow('Aerobic decoupling', decoupling.toFixed(1)+'%', decoupling>10?'⚠ significant':'', decoupling>10?'am':'');
    html+='</table></div>';
  }

  // ── 4. Coaching Verdict ───────────────────────────────────────────────────
  if(verdictTxt){
    html+='<div style="margin-top:12px;margin-bottom:2px;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:700;display:flex;align-items:center;gap:8px"><span style="background:var(--ac);color:#fff;border-radius:3px;padding:1px 6px;font-size:9px">4</span>DAILY COACHING VERDICT<span style="flex:1;height:1px;background:var(--bd)"></span></div>';
    html+='<div class="pnl" style="padding:8px 12px;text-align:center"><div style="font-size:13px;font-weight:700;color:var(--ac);padding:4px 0">&gt;&gt;&gt; '+verdictTxt+' &lt;&lt;&lt;</div></div>';
  }

  // ── 5. Recovery Projection ────────────────────────────────────────────────
  html+=briefSect('5','RECOVERY PROJECTION');
  html+=briefRow('Projected tomorrow readiness', t.tomorrow_readiness||'--', 'heuristic estimate', '');
  html+=briefRow('Recommended session type', t.recommended_session||'--', '', '');
  html+='<tr><td colspan="2" style="padding:6px 0 2px 0;font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em;font-weight:600">[Inputs used]</td></tr>';
  html+=briefRow('Today\'s readiness', rsc||'--', '', '');
  html+=briefRow('Last-night sleep', t.sleep_score||'--', '', '');
  if(rhrDelta!=null) html+=briefRow('RHR vs 7-day avg', (rhrDelta>0?'+':'')+rhrDelta+' bpm', '', rhrDelta<0?'gr':rhrDelta>4?'re':'');
  if(peakTE) html+=briefRow('Today\'s peak TE', peakTE.toFixed(1), '', '');
  if(t.atl&&t.ctl) html+=briefRow('ATL / CTL', Math.round(t.atl)+' / '+Math.round(t.ctl), '', '');
  if(acwr!=null) html+=briefRow('ACWR', acwr.toFixed(2)+' ['+(t.acwr_label||'')+']', '', acwrCls);
  html+='</table></div>';

  // ── Flags ─────────────────────────────────────────────────────────────────
  if(flags&&flags.length){
    html+='<div style="margin-top:10px">';
    html+=flags.map(function(f){
      return '<div style="background:color-mix(in srgb,var(--am) 10%,var(--sf));border-left:3px solid var(--am);border-radius:5px;padding:6px 10px;margin-bottom:5px;font-size:11px;color:var(--fg2)">⚑ '+f+'</div>';
    }).join('');
    html+='</div>';
  }

  // ── Daily Stats Grid ──────────────────────────────────────────────────────
  html+='<div class="sh" style="margin-top:14px">Daily Stats</div>';
  html+='<div class="sgrid">'+
    statCard('Resting HR',(t.resting_heart_rate||'--')+'<small> bpm</small>','')+
    statCard('HRV Weekly',(t.hrv_weekly_avg||'--')+'<small> ms</small>',t.hrv_status||'')+
    statCard('HRV Last Night',(t.hrv_last_night_avg||'--')+'<small> ms</small>','')+
    statCard('Sleep',slp?slp.toFixed(1)+'<small>h</small>':'--',slp<6?'Need more':slp>=7?'Good':'OK',slp<6?'wn':slp>=7?'up':'')+
    statCard('Readiness',rsc||'--',(t.training_readiness_level||'').replace(/_/g,' '),rc)+
    statCard('Body Battery',(t.body_battery_high||'--'),'Low: '+(t.body_battery_low||'--'))+
    statCard('Avg Stress',(t.avg_stress_level||'--'),t.avg_stress_level>50?'High':t.avg_stress_level>35?'Moderate':'Low')+
    statCard('Steps',(t.total_steps||0).toLocaleString(),'')+
    statCard('SpO2',(t.average_spo2||'--')+'<small>%</small>','')+
    statCard('Deep Sleep',t.deep_sleep_hours?t.deep_sleep_hours.toFixed(1)+'<small>h</small>':'--','')+
    statCard('Max HR',(t.max_heart_rate||'--')+'<small> bpm</small>','')+
    statCard('Calories',(t.total_calories||'--')+'<small> kcal</small>','')+
    '</div>';

  // ── Training Feedback ─────────────────────────────────────────────────────
  html+='<div class="sh" style="margin-top:4px">Training Feedback</div>';
  html+='<div class="pnl" style="font-size:12px;color:var(--fg2);line-height:1.7">'+(t.training_readiness_feedback||'').split('_').join(' ')+'</div>';

  document.getElementById('pg-today').innerHTML=html;
}

function actIcon(t){if(!t)return{i:'&#9889;',c:'oth'};t=t.toLowerCase();
  if(t.indexOf('run')>=0)return{i:'&#127939;',c:'run'};
  if(t.indexOf('ride')>=0||t.indexOf('cycl')>=0||t.indexOf('biking')>=0)return{i:'&#128692;',c:'ride'};
  if(t.indexOf('weight')>=0||t.indexOf('strength')>=0)return{i:'&#127947;',c:'str'};
  return{i:'&#9889;',c:'oth'};}

function buildActivities(){
  var html=DATA.acts.map(function(a,idx){
    var sp=actIcon(a.type),dist=a.dist||0,dur=a.dur||a.movDur||0;
    var isRun=a.type&&a.type.indexOf('run')>=0;
    var pace=isRun&&dist>500&&dur>0?fmtPace(dur/(dist/1000)):null;
    var gctCls=a.gct?(a.gct<=210?'ok':a.gct>240?'wn':''):'';
    var chips=(dist>0?'<div class="chip">&#128205; <b>'+fmtDist(dist)+'</b></div>':'')
      +(dur>0?'<div class="chip">&#9201; <b>'+fmtDur(Math.round(dur))+'</b></div>':'')
      +(pace?'<div class="chip">&#9889; <b>'+pace+'/km</b></div>':'')
      +(a.avgHR?'<div class="chip">&#10084; <b>'+a.avgHR+' bpm</b></div>':'')
      +(a.cal?'<div class="chip">&#128293; <b>'+a.cal+' kcal</b></div>':'')
      +(a.elev?'<div class="chip">&#9968; <b>'+Math.round(a.elev)+' m</b></div>':'');
    var dynBlock='';
    if(isRun&&(a.gct||a.cad||a.stride||a.vo)){
      dynBlock='<div class="dyn-row">'
        +(a.cad?'<div class="dyn"><div class="dyn-l">Cadence</div><div class="dyn-v">'+Math.round(a.cad)+'<small> spm</small></div></div>':'')
        +(a.gct?'<div class="dyn"><div class="dyn-l">GCT</div><div class="dyn-v '+gctCls+'">'+a.gct+'<small> ms</small></div></div>':'')
        +(a.gcBal?'<div class="dyn"><div class="dyn-l">GCT Bal</div><div class="dyn-v">'+a.gcBal+'<small>%L</small></div></div>':'')
        +(a.stride?'<div class="dyn"><div class="dyn-l">Stride</div><div class="dyn-v">'+(a.stride/100).toFixed(2)+'<small> m</small></div></div>':'')
        +(a.vo?'<div class="dyn"><div class="dyn-l">Vert Osc</div><div class="dyn-v">'+a.vo+'<small> cm</small></div></div>':'')
        +(a.vr?'<div class="dyn"><div class="dyn-l">Vert Ratio</div><div class="dyn-v">'+a.vr+'<small>%</small></div></div>':'')
        +(a.sslp!=null?'<div class="dyn"><div class="dyn-l">SSL%</div><div class="dyn-v">'+a.sslp+'<small>%</small></div></div>':'')
        +(a.resp?'<div class="dyn"><div class="dyn-l">Resp</div><div class="dyn-v">'+a.resp+'<small> brpm</small></div></div>':'')
        +'</div>';
    }
    return '<div class="ar" id="ar'+idx+'">'
      +'<div class="ar-top" onclick="toggleAct('+idx+')">'
      +'<div class="ai '+sp.c+'">'+sp.i+'</div>'
      +'<div style="flex:1;min-width:0"><div class="an">'+(a.name||'Activity')+'</div>'
      +'<div class="am2">'+fmtDateShort(a.dt)+' &middot; '+(a.type||'').replace(/_/g,' ')+'</div>'
      +'<div class="chips">'+chips+'</div></div>'
      +'<div class="ar-r">'+(dist>0?'<div class="ad">'+fmtDist(dist)+'</div>':'')
      +(dur>0?'<div class="at2">'+fmtDur(Math.round(dur))+'</div>':'')
      +'<div class="ei" id="ei'+idx+'">&#9660;</div></div>'
      +'</div>'+dynBlock
      +'<div class="detail" id="det'+idx+'"></div>'
      +'</div>';
  }).join('');
  document.getElementById('pg-activities').innerHTML=html;
}

var _detBuilt={};
function toggleAct(idx){
  var ar=document.getElementById('ar'+idx),det=document.getElementById('det'+idx),ei=document.getElementById('ei'+idx);
  if(ar.classList.contains('open')){ar.classList.remove('open');ei.innerHTML='&#9660;';return;}
  ar.classList.add('open');ei.innerHTML='&#9650;';
  if(!_detBuilt[idx]){_detBuilt[idx]=1;det.innerHTML=buildDetHTML(idx);buildDetCharts(idx);}
}

function buildDetHTML(idx){
  var a=DATA.acts[idx];
  var isRun=a.type&&a.type.indexOf('run')>=0;
  var isStr=a.type&&(a.type.indexOf('strength')>=0||a.type.indexOf('weight')>=0);
  function dg(l,v){return '<div class="dg"><div class="dg-l">'+l+'</div><div class="dg-v">'+(v!=null?v:'--')+'</div></div>';}
  var html='<div class="dg-grid">';
  if(a.avgHR)  html+=dg('Avg HR',a.avgHR+' bpm');
  if(a.maxHR)  html+=dg('Max HR',a.maxHR+' bpm');
  if(a.cal)    html+=dg('Calories',a.cal+' kcal');
  if(a.elev)   html+=dg('Elev Gain',Math.round(a.elev)+' m');
  if(a.avgHR&&a.maxHR) html+=dg('HR Zones','Z1:'+(a.hrZ1?fmtDur(a.hrZ1):'--')+' Z2:'+(a.hrZ2?fmtDur(a.hrZ2):'--')+' Z3:'+(a.hrZ3?fmtDur(a.hrZ3):'--')+' Z4:'+(a.hrZ4?fmtDur(a.hrZ4):'--'));
  if(a.te)     html+=dg('Aerobic TE',a.te+' — '+(a.teLabel||'').replace(/_/g,' ').toLowerCase());
  if(a.ane)    html+=dg('Anaerobic TE',a.ane+(a.aneLabel?' — '+(a.aneLabel||'').replace(/_/g,' ').toLowerCase():''));
  if(a.np)     html+=dg('Norm Power',a.np+' W');
  if(a.avgPwr) html+=dg('Avg Power',a.avgPwr+' W');
  if(a.maxPwr) html+=dg('Max Power',a.maxPwr+' W');
  if(a.np&&a.avgPwr) {var pwrZ=a.pwrZ1||a.pwrZ2||a.pwrZ3||a.pwrZ4||a.pwrZ5; if(pwrZ) html+=dg('Pwr Zones','Z1:'+(a.pwrZ1?fmtDur(a.pwrZ1):'--')+' Z2:'+(a.pwrZ2?fmtDur(a.pwrZ2):'--')+' Z3:'+(a.pwrZ3?fmtDur(a.pwrZ3):'--')+' Z4:'+(a.pwrZ4?fmtDur(a.pwrZ4):'--'));}
  if(a.load)   html+=dg('Training Load',Math.round(a.load));
  if(a.dBB!=null) html+=dg('Body Battery Δ',a.dBB>0?'+'+a.dBB:a.dBB);
  if(a.vo2max) html+=dg('VO2max',a.vo2max+' ml/kg/min');
  if(a.resp)   html+=dg('Avg Resp',a.resp+' brpm'+(a.maxResp?' (max '+a.maxResp+')':''));
  if(a.vr)     html+=dg('Vertical Ratio',a.vr+'%');
  if(a.gcBal)  html+=dg('GCT Balance',a.gcBal+'%L / '+(100-a.gcBal).toFixed(1)+'%R');
  if(a.ssl!=null)  html+=dg('Step Speed Loss',a.ssl+' m');
  if(a.sslp!=null) html+=dg('SSL %',a.sslp+'%');
  if(a.elevLoss) html+=dg('Elev Loss',Math.round(a.elevLoss)+' m');
  if(a.steps)  html+=dg('Steps',a.steps.toLocaleString());
  if(a.water)  html+=dg('Hydration Est.',a.water+' ml');
  if(a.temp_max!=null) html+=dg('Temperature',a.temp_min+'–'+a.temp_max+' °C');
  if(isRun&&a.bestKm)  html+=dg('Best 1km split',fmtDur(Math.round(a.bestKm)));
  if(isRun&&a.best5k)  html+=dg('Best 5km split',fmtDur(Math.round(a.best5k)));
  if(isRun&&a.best10k) html+=dg('Best 10km split',fmtDur(Math.round(a.best10k)));
  html+='</div>';
  if(a.gps&&a.gps.length>3){html+=buildGPSMap(a.gps);}
  if(a.chart&&a.chart.length){
    var hasGct=isRun&&a.chart.some(function(r){return r.gct;});
    var hasCad=isRun&&a.chart.some(function(r){return r.cad;});
    var hasPwr=a.chart.some(function(r){return r.pwr;});
    html+='<div class="det-charts">';
    html+='<div class="det-chart-pnl"><div class="det-chart-title">Heart Rate</div><canvas id="dc_hr_'+idx+'" height="80"></canvas></div>';
    if(isRun) html+='<div class="det-chart-pnl"><div class="det-chart-title">Pace</div><canvas id="dc_pace_'+idx+'" height="80"></canvas></div>';
    if(hasCad) html+='<div class="det-chart-pnl"><div class="det-chart-title">Cadence</div><canvas id="dc_cad_'+idx+'" height="80"></canvas></div>';
    if(hasGct) html+='<div class="det-chart-pnl"><div class="det-chart-title">Ground Contact Time</div><canvas id="dc_gct_'+idx+'" height="80"></canvas></div>';
    if(hasPwr) html+='<div class="det-chart-pnl"><div class="det-chart-title">Power</div><canvas id="dc_pwr_'+idx+'" height="80"></canvas></div>';
    html+='</div>';
  }
  if(a.kmSplits&&a.kmSplits.length){
    var hasGcbal=a.kmSplits.some(function(s){return s.gcbal!=null;});
    var hasPwr=a.kmSplits.some(function(s){return s.pwr!=null;});
    var hasSsl=a.kmSplits.some(function(s){return s.sslp!=null;});
    var hasGap=a.kmSplits.some(function(s){return s.gapace!=null;});
    var hasTemp=a.kmSplits.some(function(s){return s.temp!=null;});
    html+='<div class="sh">Per-km Splits</div><div style="overflow-x:auto"><table class="stbl"><thead><tr>'
      +'<th>km</th><th>Time</th><th>Pace</th>'+(hasGap?'<th>GA Pace</th>':'')+'<th>HR</th><th>Cad</th><th>GCT</th>'+(hasGcbal?'<th>GCT Bal</th>':'')+'<th>Stride</th><th>VO</th><th>VR</th>'+(hasPwr?'<th>Pwr</th>':'')+(hasSsl?'<th>SSL%</th>':'')+(hasTemp?'<th>Temp</th>':'')
      +'</tr></thead><tbody>';
    a.kmSplits.forEach(function(sp){
      var vrKm=sp.vrat?sp.vrat.toFixed(1):(sp.vo&&sp.stride?((sp.vo/sp.stride)*10).toFixed(1):null);
      html+='<tr><td>'+sp.km+'</td><td>'+(sp.dur?fmtDur(sp.dur):'--')+'</td><td>'+(sp.pace?fmtPace(sp.pace):'--')+'</td>'
        +(hasGap?'<td>'+(sp.gapace?fmtPace(sp.gapace):'--')+'</td>':'')
        +'<td>'+(sp.avgHR||'--')+'</td><td>'+(sp.cad||'--')+'</td>'
        +'<td>'+(sp.gct?sp.gct+' ms':'--')+'</td>'
        +(hasGcbal?'<td>'+(sp.gcbal!=null?sp.gcbal+'%L':'--')+'</td>':'')
        +'<td>'+(sp.stride?(sp.stride/100).toFixed(2)+' m':'--')+'</td>'
        +'<td>'+(sp.vo?(sp.vo/10).toFixed(1)+' cm':'--')+'</td>'
        +'<td>'+(vrKm?vrKm+'%':'--')+'</td>'
        +(hasPwr?'<td>'+(sp.pwr!=null?sp.pwr+' W':'--')+'</td>':'')
        +(hasSsl?'<td>'+(sp.sslp!=null?sp.sslp+'%':'--')+'</td>':'')
        +(hasTemp?'<td>'+(sp.temp!=null?sp.temp+'°':'--')+'</td>':'')
        +'</tr>';
    });
    html+='</tbody></table></div>';
  }
  if(isStr&&a.exSets&&a.exSets.length){
    // Group sets by exercise name
    var exMap={};
    a.exSets.forEach(function(s){
      var n=s.ex||'Exercise';
      if(!exMap[n]) exMap[n]={sets:[],musclesP:s.musclesP||[],musclesS:s.musclesS||[]};
      exMap[n].sets.push(s);
    });
    html+='<div class="sh">Exercise Sets</div>';
    // Per-set table
    html+='<div style="overflow-x:auto"><table class="stbl"><thead><tr>'
      +'<th>Set</th><th>Exercise</th><th>Time</th><th>Rest</th><th>Reps</th><th>Weight</th><th>Volume</th>'
      +'</tr></thead><tbody>';
    a.exSets.forEach(function(s){
      var durStr=s.dur?(Math.floor(s.dur/60)+':'+(s.dur%60<10?'0':'')+Math.floor(s.dur%60)):'--';
      var restStr=s.rest?(Math.floor(s.rest/60)+':'+(s.rest%60<10?'0':'')+Math.floor(s.rest%60)):'--';
      html+='<tr>'
        +'<td><span class="set-num">'+s.set+'</span></td>'
        +'<td>'+escHtml(s.ex||'--')+'</td>'
        +'<td style="color:var(--ac)">'+durStr+'</td>'
        +'<td>'+restStr+'</td>'
        +'<td>'+(s.reps!=null?s.reps:'--')+'</td>'
        +'<td>'+(s.kg!=null?s.kg+' kg':'--')+'</td>'
        +'<td>'+(s.vol!=null?s.vol+' kg':'--')+'</td>'
        +'</tr>';
    });
    html+='</tbody></table></div>';
    // Exercise summary
    var exNames=Object.keys(exMap);
    if(exNames.length){
      html+='<div class="sh" style="margin-top:12px">By Exercise</div>';
      html+='<div style="overflow-x:auto"><table class="stbl"><thead><tr>'
        +'<th>Exercise</th><th>Sets</th><th>Total Reps</th><th>Avg Weight</th><th>Total Volume</th>'
        +'</tr></thead><tbody>';
      exNames.forEach(function(nm){
        var sets=exMap[nm].sets;
        var totalReps=sets.reduce(function(a,s){return a+(s.reps||0);},0);
        var wts=sets.filter(function(s){return s.kg!=null;});
        var avgWt=wts.length?Math.round(wts.reduce(function(a,s){return a+s.kg;},0)/wts.length*10)/10:null;
        var totalVol=sets.reduce(function(a,s){return a+(s.vol||0);},0);
        html+='<tr>'
          +'<td>'+escHtml(nm)+'</td>'
          +'<td>'+sets.length+'</td>'
          +'<td>'+(totalReps||'--')+'</td>'
          +'<td>'+(avgWt!=null?avgWt+' kg':'--')+'</td>'
          +'<td>'+(totalVol>0?Math.round(totalVol)+' kg':'--')+'</td>'
          +'</tr>';
      });
      html+='</tbody></table></div>';
    }
  }
  var copyData=a.copyText||'No data available';
  html+='<div class="copy-wrap"><div class="copy-lbl">Copy for Claude</div>'
    +'<button class="copy-btn" id="cpbtn'+idx+'">Copy</button>'
    +'<div class="copy-text" id="cptxt'+idx+'"></div></div>';
  // Set text content safely (avoids HTML injection)
  return html;
}

function escHtml(s){
  var d=document.createElement('div');d.textContent=s;return d.innerHTML;
}

function buildDetCharts(idx){
  var a=DATA.acts[idx];
  // Set copy text content safely
  var txtEl=document.getElementById('cptxt'+idx);
  if(txtEl) txtEl.textContent=a.copyText||'No data available';
  var cpBtn=document.getElementById('cpbtn'+idx);
  if(cpBtn) cpBtn.onclick=function(){copyEl(document.getElementById('cptxt'+idx));};

  if(!a.chart||!a.chart.length)return;
  var ch=a.chart;
  var isRun=a.type&&a.type.indexOf('run')>=0;
  var lbl=ch.map(function(r){var s=r.t||0;return s>3600?(Math.floor(s/3600)+'h'+Math.floor((s%3600)/60)+'m'):Math.floor(s/60)+'m';});
  var baseOpts={responsive:true,maintainAspectRatio:true,animation:{duration:0},plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,backgroundColor:gv('--sf'),borderColor:gv('--bd'),borderWidth:1,titleColor:gv('--fg'),bodyColor:gv('--fg2'),padding:6}}};
  var axes={x:{grid:{display:false},ticks:{color:gv('--fg3'),maxRotation:0,font:{size:7},maxTicksLimit:6}},y:{grid:{color:gv('--bd')},ticks:{color:gv('--fg3'),font:{size:7}}}};

  var hrEl=document.getElementById('dc_hr_'+idx);
  if(hrEl){new Chart(hrEl,{type:'line',data:{labels:lbl,datasets:[{data:ch.map(function(r){return r.hr;}),borderColor:gv('--re'),borderWidth:1.5,pointRadius:0,tension:0.3,fill:true,backgroundColor:gv('--re')+'18'}]},options:Object.assign({},baseOpts,{scales:axes})});}

  if(isRun){
    var paceEl=document.getElementById('dc_pace_'+idx);
    if(paceEl){
      var paceData=ch.map(function(r){return r.pace&&r.pace<900?r.pace:null;});
      var paceAxes=Object.assign({},axes,{y:Object.assign({},axes.y,{reverse:true,ticks:{color:gv('--fg3'),font:{size:7},callback:function(v){return v?Math.floor(v/60)+':'+(Math.round(v%60)<10?'0':'')+Math.round(v%60):'';}}})} );
      new Chart(paceEl,{type:'line',data:{labels:lbl,datasets:[{data:paceData,borderColor:gv('--ac'),borderWidth:1.5,pointRadius:0,tension:0.3,spanGaps:false}]},options:Object.assign({},baseOpts,{scales:paceAxes})});}
    var cadEl=document.getElementById('dc_cad_'+idx);
    if(cadEl){new Chart(cadEl,{type:'line',data:{labels:lbl,datasets:[{data:ch.map(function(r){return r.cad;}),borderColor:gv('--bl'),borderWidth:1.5,pointRadius:0,tension:0.3}]},options:Object.assign({},baseOpts,{scales:axes})});}
    var gctEl=document.getElementById('dc_gct_'+idx);
    if(gctEl){new Chart(gctEl,{type:'line',data:{labels:lbl,datasets:[{data:ch.map(function(r){return r.gct;}),borderColor:gv('--am'),borderWidth:1.5,pointRadius:0,tension:0.3}]},options:Object.assign({},baseOpts,{scales:axes})});}
  }
  var pwrEl=document.getElementById('dc_pwr_'+idx);
  if(pwrEl){new Chart(pwrEl,{type:'line',data:{labels:lbl,datasets:[{data:ch.map(function(r){return r.pwr;}),borderColor:gv('--pu'),borderWidth:1.5,pointRadius:0,tension:0.3}]},options:Object.assign({},baseOpts,{scales:axes})});}
}

function buildGPSMap(pts){
  if(!pts||pts.length<4)return'';
  var lats=[],lons=[];
  for(var i=0;i<pts.length;i+=2){lats.push(pts[i]);lons.push(pts[i+1]);}
  var minLat=Math.min.apply(null,lats),maxLat=Math.max.apply(null,lats);
  var minLon=Math.min.apply(null,lons),maxLon=Math.max.apply(null,lons);
  var latSpan=maxLat-minLat||0.001,lonSpan=maxLon-minLon||0.001;
  var W=340,H=200,pad=0.08;
  function tx(lon){return Math.round(((lon-minLon)/lonSpan)*(W*(1-2*pad))+W*pad);}
  function ty(lat){return Math.round((1-(lat-minLat)/latSpan)*(H*(1-2*pad))+H*pad);}
  var poly='';
  for(var j=0;j<lats.length;j++){poly+=(j?'L':'M')+tx(lons[j])+' '+ty(lats[j]);}
  var sx=tx(lons[0]),sy=ty(lats[0]),ex=tx(lons[lons.length-1]),ey=ty(lats[lats.length-1]);
  return '<div class="gmap"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">'
    +'<rect width="'+W+'" height="'+H+'" fill="var(--sf2)"/>'
    +'<path d="'+poly+'" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>'
    +'<circle cx="'+sx+'" cy="'+sy+'" r="4" fill="var(--gr)"/>'
    +'<circle cx="'+ex+'" cy="'+ey+'" r="4" fill="var(--re)"/>'
    +'</svg></div>';
}
